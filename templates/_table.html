<table class="tbl">
    <thead>
        <tr>
            <th>Description</th>
            <th class="col-package">Package</th>
            <th class="col-container">Container</th>
            <th class="col-qty">Qty</th>
            <th class="col-notes">Notes</th>
            <th class="col-category">Category</th>
            <th class="col-subcat">Subcat</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for part in parts %}
        {% include "_row.html" %}
        {% endfor %}
        {% if parts|length == 0 %}
        <tr>
            <td colspan="8" class="muted">No entries yet.</td>
        </tr>
        {% endif %}
    </tbody>
</table>
